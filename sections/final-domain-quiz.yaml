# Final domain knowledge check across all five sections.
schema_version: 1
kind: question_bank
id: ats053-final
course_id: ATS053
exam_code: CCA
status: alpha
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: domain
  id: network-policy
  title: Network Policy
questions:
- id: ats053-final-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Read the subject and direction of a policy
  source_readings:
  - sections/section-010/module-01/course-01-interpreting-a-cilium-policy-as-a-communication-contract.md
  prompt: A policy has `endpointSelector` for `probe` and an `ingress` rule for `shuttle`
    on TCP 8080. Which request is dropped?
  options:
  - id: a
    text: A request from `shuttle` to `probe` on TCP 8080.
    explanation: The rule allows it.
  - id: b
    text: A request from `drifter` to `probe` on TCP 8080.
    explanation: Correct. The `probe` pods are in default deny for ingress, and no
      rule allows `drifter`.
  - id: c
    text: A request from `probe` to the DNS service.
    explanation: The policy has no egress section.
  - id: d
    text: A reply from `probe` to `shuttle`.
    explanation: Replies of allowed connections pass.
  correct_option: b
  explanation: The `probe` pods are in default deny for ingress, and no rule allows
    `drifter`.
- id: ats053-final-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why an egress policy needs DNS
  source_readings:
  - sections/section-010/module-02/course-01-egress-dependencies-and-dns.md
  prompt: Which rule must an egress policy contain so that names can be resolved?
  options:
  - id: a
    text: An egress rule that allows the DNS pods on port 53.
    explanation: Correct. The lookup is a separate connection.
  - id: b
    text: An ingress rule on the DNS pods in the destination.
    explanation: The sender needs egress permission.
  - id: c
    text: A `toFQDNs` rule without a DNS rule.
    explanation: It needs the DNS rule.
  - id: d
    text: No rule, because DNS is always allowed.
    explanation: DNS is allowed only when a rule allows it.
  correct_option: a
  explanation: The lookup is a separate connection.
- id: ats053-final-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Explain why identity replaces addresses
  source_readings:
  - sections/section-020/module-01/course-01-security-identities-labels-and-address-independence.md
  prompt: Why do Cilium rules use identities?
  options:
  - id: a
    text: They are faster to type.
    explanation: The reason is stability.
  - id: b
    text: They are required by Kubernetes.
    explanation: Kubernetes does not require them.
  - id: c
    text: They hide pod names.
    explanation: They do not hide anything.
  - id: d
    text: They stay stable while pods start, stop and change addresses.
    explanation: Correct. The identity follows the labels.
  correct_option: d
  explanation: The identity follows the labels.
- id: ats053-final-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Know which labels count
  source_readings:
  - sections/section-020/module-01/course-02-how-labels-become-an-identity.md
  prompt: Which label change leaves the identity of a pod unchanged?
  options:
  - id: a
    text: A new `team=bridge` label.
    explanation: It is relevant and changes the identity.
  - id: b
    text: A changed `app` label.
    explanation: It changes the identity.
  - id: c
    text: A new `pod-template-hash` label.
    explanation: Correct. The default filter excludes it.
  - id: d
    text: A move to another namespace.
    explanation: The namespace is part of the identity.
  correct_option: c
  explanation: The default filter excludes it.
- id: ats053-final-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Pick a policy kind by scope
  source_readings:
  - sections/section-020/module-02/course-01-selecting-peers-across-namespaces.md
  prompt: A guard must deny the `world` entity into every namespace. Which resource
    fits?
  options:
  - id: a
    text: A NetworkPolicy in each namespace.
    explanation: The standard API has no deny.
  - id: b
    text: A CiliumClusterwideNetworkPolicy with an `ingressDeny` rule.
    explanation: Correct. It has cluster scope and deny rules.
  - id: c
    text: A CiliumNetworkPolicy in one namespace.
    explanation: It selects only its own namespace.
  - id: d
    text: An `ingress` rule for `world`.
    explanation: This allows `world`.
  correct_option: b
  explanation: It has cluster scope and deny rules.
- id: ats053-final-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Know what the entity world selects
  source_readings:
  - sections/section-020/module-02/course-02-reserved-identities-entities-and-cidr.md
  prompt: Which statement about the entity `world` is correct?
  options:
  - id: a
    text: It selects addresses outside the cluster.
    explanation: Correct. Nodes and pods of the cluster have their own identities.
  - id: b
    text: It selects all nodes and pods.
    explanation: That is the entity `cluster`.
  - id: c
    text: It selects only the Kubernetes API server.
    explanation: That is `kube-apiserver`.
  - id: d
    text: It selects only the local node.
    explanation: That is `host`.
  correct_option: a
  explanation: Nodes and pods of the cluster have their own identities.
- id: ats053-final-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Describe default enforcement
  source_readings:
  - sections/section-030/module-01/course-01-default-always-and-never-policy-enforcement.md
  prompt: In `default` mode, what does a policy with only an `egress` section do to
    the ingress of its subject?
  options:
  - id: a
    text: It turns on default deny for ingress too.
    explanation: The ingress flag is unchanged.
  - id: b
    text: It blocks ingress for 30 seconds.
    explanation: There is no timer.
  - id: c
    text: It deletes the ingress rules of other policies.
    explanation: Policies do not delete each other.
  - id: d
    text: Nothing, because ingress stays open.
    explanation: Correct. Each direction has its own flag.
  correct_option: d
  explanation: Each direction has its own flag.
- id: ats053-final-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose between always and never
  source_readings:
  - sections/section-030/module-01/course-01-default-always-and-never-policy-enforcement.md
  prompt: Which mode puts every endpoint into default deny, even without a policy?
  options:
  - id: a
    text: "`default`"
    explanation: Flags turn on only for selected endpoints.
  - id: b
    text: "`never`"
    explanation: No flag is on.
  - id: c
    text: "`always`"
    explanation: Correct. Both flags are on for every endpoint.
  - id: d
    text: "`audit`"
    explanation: Audit is not a value of the mode setting.
  correct_option: c
  explanation: Both flags are on for every endpoint.
- id: ats053-final-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Use audit mode before enforcement
  source_readings:
  - sections/section-030/module-02/course-01-audit-mode.md
  prompt: A team wants to find missing rules before a policy drops traffic. Which
    tool fits?
  options:
  - id: a
    text: The `never` mode.
    explanation: It disables policy for everyone.
  - id: b
    text: Audit mode on the endpoint, then read `AUDIT` verdicts.
    explanation: Correct. Audit mode allows the flow and reports it.
  - id: c
    text: A deny rule.
    explanation: It drops traffic.
  - id: d
    text: A larger timeout in the client.
    explanation: It does not report policy gaps.
  correct_option: b
  explanation: Audit mode allows the flow and reports it.
- id: ats053-final-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Read port and peer fields together
  source_readings:
  - sections/section-040/module-01/course-02-ports-and-rule-combination.md
  prompt: An ingress rule lists `fromEndpoints` for `shuttle` and `toPorts` with TCP
    8080. What must a request match?
  options:
  - id: a
    text: Both the peer and the port.
    explanation: Correct. Fields in one rule are joined with AND.
  - id: b
    text: Either the peer or the port.
    explanation: That is the meaning of two rules.
  - id: c
    text: Only the port.
    explanation: The peer restricts the rule.
  - id: d
    text: Only the peer.
    explanation: The port restricts the rule too.
  correct_option: a
  explanation: Fields in one rule are joined with AND.
- id: ats053-final-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Tell a Layer 7 mismatch from a drop
  source_readings:
  - sections/section-040/module-02/course-01-http-and-dns-rules.md
  prompt: A client receives HTTP 403 for `GET /private`. What does this show?
  options:
  - id: a
    text: A Layer 3 rule dropped it.
    explanation: A drop would time out.
  - id: b
    text: The application crashed.
    explanation: A crash does not give a policy status.
  - id: c
    text: The DNS rule failed.
    explanation: DNS has no HTTP status.
  - id: d
    text: A Layer 7 rule rejected the request in the proxy.
    explanation: Correct. A Layer 3 or Layer 4 drop gives no answer.
  correct_option: d
  explanation: A Layer 3 or Layer 4 drop gives no answer.
- id: ats053-final-q12
  type: single_choice
  difficulty: advanced
  learning_objective: Know precedence of deny
  source_readings:
  - sections/section-040/module-02/course-02-deny-rules-and-precedence.md
  prompt: A CiliumNetworkPolicy denies `drifter`, and a NetworkPolicy allows it. What
    happens to its request?
  options:
  - id: a
    text: It is allowed, because the NetworkPolicy is standard.
    explanation: The standard kind has no precedence.
  - id: b
    text: It is allowed on the allowed ports only.
    explanation: Deny drops the request entirely.
  - id: c
    text: It is dropped, because deny wins across all policy kinds.
    explanation: Correct. No allow rule can restore traffic that a deny drops.
  - id: d
    text: The agent rejects both policies.
    explanation: Both are valid.
  correct_option: c
  explanation: No allow rule can restore traffic that a deny drops.
- id: ats053-final-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: Read a NetworkPolicy peer item
  source_readings:
  - sections/section-050/module-01/course-01-the-networkpolicy-api.md
  prompt: Which peer form selects pods in the policy namespace only?
  options:
  - id: a
    text: A peer item with an empty `namespaceSelector`.
    explanation: It matches every namespace.
  - id: b
    text: A peer item with only a `podSelector`.
    explanation: Correct. Without a `namespaceSelector`, it uses the policy namespace.
  - id: c
    text: A peer item with `ipBlock`.
    explanation: It selects addresses.
  - id: d
    text: A peer item with `nodeSelector`.
    explanation: It does not exist in the standard API.
  correct_option: b
  explanation: Without a `namespaceSelector`, it uses the policy namespace.
- id: ats053-final-q14
  type: single_choice
  difficulty: advanced
  learning_objective: Combine kinds by union
  source_readings:
  - sections/section-050/module-01/course-02-how-cilium-enforces-networkpolicy.md
  prompt: A NetworkPolicy and a CiliumNetworkPolicy select the same pods with different
    allows. What is allowed?
  options:
  - id: a
    text: The union of both sets.
    explanation: Correct. Allow rules of all kinds add up.
  - id: b
    text: Only the NetworkPolicy set.
    explanation: No kind has priority.
  - id: c
    text: Only the intersection.
    explanation: Allows do not intersect.
  - id: d
    text: Nothing until one policy is removed.
    explanation: They do not conflict.
  correct_option: a
  explanation: Allow rules of all kinds add up.
- id: ats053-final-q15
  type: single_choice
  difficulty: advanced
  learning_objective: Choose a kind for a requirement
  source_readings:
  - sections/section-050/module-02/course-02-choosing-a-policy-kind-and-migrating.md
  prompt: A rule must allow only `GET /public` to `probe` and stay inside one namespace.
    Which kind fits?
  options:
  - id: a
    text: A NetworkPolicy.
    explanation: It cannot express HTTP rules.
  - id: b
    text: A CiliumClusterwideNetworkPolicy.
    explanation: It works, but its scope is wider than needed.
  - id: c
    text: An `ingressDeny` rule on `/private`.
    explanation: Layer 7 deny is not supported.
  - id: d
    text: A CiliumNetworkPolicy, because the requirement needs Layer 7 and a namespace
      scope.
    explanation: Correct. The standard API has no Layer 7 and the clusterwide kind
      is wider than needed.
  correct_option: d
  explanation: The standard API has no Layer 7 and the clusterwide kind is wider than
    needed.
