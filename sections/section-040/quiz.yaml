# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats053-040
course_id: ATS053
exam_code: CCA
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-040
  title: Policy Rule Structure
questions:
- id: ats053-040-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Read the direction fields
  source_readings:
  - sections/section-040/module-01/course-01-policy-anatomy-and-peer-selectors.md
  prompt: In a policy with `endpointSelector` for `probe`, what does `egress` with
    `toEndpoints` describe?
  options:
  - id: a
    text: Traffic that arrives at the `probe` pods.
    explanation: That is ingress.
  - id: b
    text: Traffic that leaves the `probe` pods and its allowed destinations.
    explanation: Correct. Direction is relative to the subject.
  - id: c
    text: Traffic between two other pods.
    explanation: A policy describes traffic of its subject.
  - id: d
    text: Traffic to the node only.
    explanation: That needs the entity `host`.
  correct_option: b
  explanation: Direction is relative to the subject.
- id: ats053-040-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Write selector expressions
  source_readings:
  - sections/section-040/module-01/course-01-policy-anatomy-and-peer-selectors.md
  prompt: Which selector matches pods whose `app` label is `shuttle` or `scout`?
  options:
  - id: a
    text: "`matchExpressions` with key `app`, operator `In` and values `shuttle` and
      `scout`."
    explanation: Correct. The `In` operator accepts several values.
  - id: b
    text: "`matchLabels` with `app: shuttle` and `app: scout`."
    explanation: A map cannot hold the same key twice.
  - id: c
    text: "`matchExpressions` with operator `Exists`."
    explanation: It matches any value of the key.
  - id: d
    text: "`matchExpressions` with operator `NotIn`."
    explanation: It excludes the values.
  correct_option: a
  explanation: The `In` operator accepts several values.
- id: ats053-040-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Know where nodeSelector is valid
  source_readings:
  - sections/section-040/module-01/course-01-policy-anatomy-and-peer-selectors.md
  prompt: Which policy kind may use `nodeSelector`?
  options:
  - id: a
    text: Only the CiliumNetworkPolicy.
    explanation: The namespaced kind cannot select nodes.
  - id: b
    text: Both Cilium kinds and NetworkPolicy.
    explanation: NetworkPolicy has no such field.
  - id: c
    text: No kind.
    explanation: The clusterwide kind supports it.
  - id: d
    text: The CiliumClusterwideNetworkPolicy only.
    explanation: Correct. Only the clusterwide kind can select nodes.
  correct_option: d
  explanation: Only the clusterwide kind can select nodes.
- id: ats053-040-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Write port rules
  source_readings:
  - sections/section-040/module-01/course-02-ports-and-rule-combination.md
  prompt: How do you allow TCP ports 9000 to 9100 in a Cilium rule?
  options:
  - id: a
    text: "`port: 9000-9100`"
    explanation: A range is not written in the port field.
  - id: b
    text: '`port: "9000"` and `port: "9100"`'
    explanation: That allows only two ports.
  - id: c
    text: '`port: "9000"` with `endPort: 9100` and `protocol: TCP`.'
    explanation: Correct. `endPort` ends the range, and the port is a string.
  - id: d
    text: "`ports: any`"
    explanation: There is no such value.
  correct_option: c
  explanation: "`endPort` ends the range, and the port is a string."
- id: ats053-040-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Know the effect of a rule without toPorts
  source_readings:
  - sections/section-040/module-01/course-02-ports-and-rule-combination.md
  prompt: An ingress rule has `fromEndpoints` for `shuttle` and no `toPorts`. What
    does it allow?
  options:
  - id: a
    text: No port.
    explanation: Without ports, the rule is not narrowed.
  - id: b
    text: Every port and protocol from `shuttle`.
    explanation: Correct. A rule without ports allows all ports for its peers.
  - id: c
    text: Only port 80.
    explanation: No default port exists.
  - id: d
    text: Only TCP.
    explanation: The protocol is not restricted either.
  correct_option: b
  explanation: A rule without ports allows all ports for its peers.
- id: ats053-040-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Predict the result of a Layer 7 mismatch
  source_readings:
  - sections/section-040/module-02/course-01-http-and-dns-rules.md
  prompt: A rule allows `GET /public` on TCP 8080. A request `GET /private` from an
    allowed client arrives. What does the client get?
  options:
  - id: a
    text: An HTTP response with status 403 from the proxy.
    explanation: Correct. A Layer 7 mismatch is answered by the proxy.
  - id: b
    text: A timeout.
    explanation: A timeout is the result of a Layer 3 or Layer 4 drop.
  - id: c
    text: The application response, because the port is allowed.
    explanation: The proxy checks the path first.
  - id: d
    text: A TCP reset only.
    explanation: The proxy sends an HTTP answer.
  correct_option: a
  explanation: A Layer 7 mismatch is answered by the proxy.
- id: ats053-040-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Combine DNS and toFQDNs rules
  source_readings:
  - sections/section-040/module-02/course-01-http-and-dns-rules.md
  prompt: Which pair lets a pod look up and then connect to `api.example.com`?
  options:
  - id: a
    text: Only a `toFQDNs` rule.
    explanation: Without a DNS rule, no addresses are learned.
  - id: b
    text: Only a DNS rule.
    explanation: It allows lookups and no connection.
  - id: c
    text: A `toCIDR` rule for `api.example.com`.
    explanation: CIDR rules take addresses and not names.
  - id: d
    text: A DNS rule for the DNS service on port 53 and a `toFQDNs` rule for the name.
    explanation: Correct. The DNS rule lets the proxy learn the addresses, and the
      `toFQDNs` rule allows connections to them.
  correct_option: d
  explanation: The DNS rule lets the proxy learn the addresses, and the `toFQDNs`
    rule allows connections to them.
- id: ats053-040-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Know that deny wins
  source_readings:
  - sections/section-040/module-02/course-02-deny-rules-and-precedence.md
  prompt: One rule allows the entity `cluster` on TCP 8080. Another rule denies `drifter`.
    A request from `drifter` arrives. What happens?
  options:
  - id: a
    text: It is allowed, because `cluster` includes `drifter`.
    explanation: Allow cannot override deny.
  - id: b
    text: It is allowed, because the allow was written first.
    explanation: Order does not matter.
  - id: c
    text: It is dropped, because a deny rule wins over every allow rule.
    explanation: Correct. Deny has precedence.
  - id: d
    text: It is allowed on port 8080 only.
    explanation: Deny drops the request entirely.
  correct_option: c
  explanation: Deny has precedence.
- id: ats053-040-q09
  type: single_choice
  difficulty: advanced
  learning_objective: State the limits of deny rules
  source_readings:
  - sections/section-040/module-02/course-02-deny-rules-and-precedence.md
  prompt: A team wants to block the HTTP path `/admin` with a deny rule. Is this supported?
  options:
  - id: a
    text: Yes, with `ingressDeny` and `rules.http`.
    explanation: Layer 7 deny is not supported.
  - id: b
    text: No, deny rules do not support Layer 7, so an allow rule with HTTP rules
      that leaves the path out is needed.
    explanation: Correct. Deny rules work on identities, addresses and ports.
  - id: c
    text: Yes, with `toFQDNs` in a deny rule.
    explanation: "`toFQDNs` is not supported in deny rules."
  - id: d
    text: Yes, but only in a clusterwide policy.
    explanation: The limit holds for both kinds.
  correct_option: b
  explanation: Deny rules work on identities, addresses and ports.
- id: ats053-040-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Know that deny policies enforce default deny
  source_readings:
  - sections/section-040/module-02/course-02-deny-rules-and-precedence.md
  prompt: A policy has only an `ingressDeny` rule for `drifter` and nothing else selects
    `probe`. What about a request from `shuttle`?
  options:
  - id: a
    text: It is dropped, because any policy with an ingress section puts the subject
      into default deny.
    explanation: Correct. A deny policy turns on enforcement too, and no allow rule
      matches `shuttle`.
  - id: b
    text: It is allowed, because only `drifter` is denied.
    explanation: Enforcement is on, so only allowed traffic passes.
  - id: c
    text: It is allowed, because deny policies do not enforce.
    explanation: They do.
  - id: d
    text: It gets status 403.
    explanation: This is a Layer 3 decision and gets no answer.
  correct_option: a
  explanation: A deny policy turns on enforcement too, and no allow rule matches `shuttle`.
